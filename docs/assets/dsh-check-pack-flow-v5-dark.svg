<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
<title id="title">dsh-check-pack bundle lifecycle</title>
<desc id="desc">Eight sample members of the 53 checker suite, with their exact versions, converge at build time into the three manifests of one bundle: package.json dependencies, the cordis.patch.yml insert rows, and checkers.json. The node verify.mjs gate checks that all three carry the same 53 rows and that versions match; a mismatch throws. At install time the same bundle patch expands into 53 insert rows of a Cordis profile, with no tools, commands, services or routes registered. A dashed return shows the published snapshot does not drift in from upstream: rebuild and republish. The footer lists the eight scope domains.</desc>
